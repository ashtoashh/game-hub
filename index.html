<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🎮 Game Hub</h1>
    <p>A small collection of browser games. Pick one and play.</p>
  </header>

  <main class="grid">
    <a class="card" href="games/snake/">
      <div class="thumb snake-thumb" aria-hidden="true"></div>
      <h2>Snake</h2>
      <p>Classic snake. Eat, grow, don't hit yourself.</p>
    </a>

    <a class="card" href="games/memory/">
      <div class="thumb memory-thumb" aria-hidden="true"></div>
      <h2>Memory Match</h2>
      <p>Flip cards, find the pairs, beat your best time.</p>
    </a>
  </main>

  <footer>
    <p>More games coming soon. Add a folder under <code>games/</code> to publish a new one.</p>
  </footer>
</body>
</html>
