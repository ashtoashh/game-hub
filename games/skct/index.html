<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>적성검사 실전 연습</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f4f4f2;
  --surface:#ffffff;
  --text:#111111;
  --sub:#888;
  --border:#e2e2de;
  --accent:#2563eb;
  --accent-light:#eff4ff;
  --correct:#16a34a;
  --wrong:#dc2626;
  --warn:#d97706;
}

body{
  font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:32px 16px 60px;
}

#back-link{width:100%;max-width:560px;display:block;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:16px;}
#back-link:hover{color:var(--text);}

header{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;}
header h1{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);}
#area-badge{font-size:12px;font-weight:600;background:var(--accent-light);color:var(--accent);padding:4px 12px;border-radius:20px;}

#progress-wrap{width:100%;max-width:560px;margin-bottom:24px;}
#progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px;}
#progress-bar-bg{width:100%;height:4px;background:var(--border);border-radius:2px;}
#progress-bar{height:4px;background:var(--accent);border-radius:2px;transition:width .3s ease;}

#score-row{width:100%;max-width:560px;display:flex;gap:10px;margin-bottom:24px;}
.chip{flex:1;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;}
.chip .c-label{font-size:11px;color:var(--sub);}
.chip .c-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}

#question-card{width:100%;max-width:560px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:26px 24px 22px;margin-bottom:16px;}
#q-type-label{font-size:11px;color:var(--sub);font-weight:500;letter-spacing:.06em;margin-bottom:16px;}

.passage{background:var(--bg);border-radius:10px;padding:16px;font-size:14px;line-height:1.75;margin-bottom:14px;}
.word-text{font-size:15px;line-height:1.85;margin-bottom:4px;text-align:center;}
.q-text{font-size:15px;font-weight:600;text-align:center;margin:4px 0 2px;}

table.data-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
table.data-table th,table.data-table td{border:1px solid var(--border);padding:8px 6px;font-size:13px;text-align:center;}
table.data-table th{background:var(--bg);font-weight:600;}

.premise-box{background:var(--bg);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
.premise{font-size:14px;position:relative;padding-left:14px;}
.premise::before{content:'•';position:absolute;left:0;color:var(--accent);}

.seq-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.seq-num{width:52px;height:52px;border-radius:10px;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;}
.seq-num.blank{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-size:24px;}

#hint-text{font-size:12px;color:var(--sub);text-align:center;min-height:16px;margin-top:6px;}

#choices{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;text-align:left;transition:background .1s,border-color .1s,transform .08s;}
.choice-btn:hover{background:var(--accent-light);border-color:var(--accent);}
.choice-btn:active{transform:scale(.98);}
.choice-btn.correct{background:#dcfce7;border-color:var(--correct);color:var(--correct);font-weight:600;}
.choice-btn.wrong{background:#fee2e2;border-color:var(--wrong);color:var(--wrong);font-weight:600;}

#feedback{width:100%;max-width:560px;min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;margin-bottom:16px;opacity:0;transition:opacity .2s;}
#feedback.show{opacity:1;}
#feedback.correct{background:#dcfce7;color:var(--correct);}
#feedback.wrong{background:#fee2e2;color:var(--wrong);}

#explain-box{display:none;width:100%;max-width:560px;background:var(--accent-light);border:1.5px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-line;}
#explain-box.show{display:block;}
#explain-box .e-label{display:block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;}

#btn-next{display:none;width:100%;max-width:560px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px;transition:opacity .1s;}
#btn-next.show{display:block;}
#btn-next:active{opacity:.8;}

#timer-wrap{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
#timer-bar-bg{flex:1;height:5px;background:var(--border);border-radius:3px;}
#timer-bar{height:5px;background:var(--accent);border-radius:3px;transition:width .1s linear,background .3s;}
#timer-label{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:32px;text-align:right;}

#result-screen{display:none;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:560px;}
#result-screen.show{display:flex;}
#game-wrap.hidden{display:none;}

.result-card{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;}
.r-big{font-size:48px;font-weight:700;letter-spacing:-.03em;text-align:center;}
.r-label{font-size:13px;color:var(--sub);text-align:center;}
.r-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.r-stat{display:flex;flex-direction:column;align-items:center;gap:4px;}
.r-stat .rv{font-size:20px;font-weight:700;}
.r-stat .rl{font-size:11px;color:var(--sub);}

.grade-badge{font-size:13px;font-weight:600;padding:6px 20px;border-radius:20px;background:var(--accent-light);color:var(--accent);text-align:center;margin:0 auto;}

.area-breakdown{display:flex;flex-direction:column;gap:8px;}
.area-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:8px;padding:10px 14px;font-size:13px;}
.area-row .a-name{font-weight:600;}
.area-row .a-score{color:var(--sub);font-variant-numeric:tabular-nums;}

#btn-restart,#btn-menu,#btn-history,#btn-close-history{width:100%;padding:15px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .1s;}
#btn-restart{background:var(--accent);color:#fff;}
#btn-menu,#btn-history,#btn-close-history{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
#btn-restart:active,#btn-menu:active,#btn-history:active,#btn-close-history:active{opacity:.8;}

#btn-clear-history{width:100%;padding:13px;background:#fee2e2;color:var(--wrong);border:1.5px solid var(--wrong);border-radius:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .1s;}
#btn-clear-history:active{opacity:.8;}

#history-screen{display:none;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:560px;}
#history-screen.show{display:flex;}

.section-title{width:100%;font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}

.history-list,.wrong-notebook{width:100%;display:flex;flex-direction:column;gap:8px;}
.history-item{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;}
.history-item .h-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;}
.history-item .h-sub{font-size:11px;color:var(--sub);}
.history-empty{width:100%;font-size:13px;color:var(--sub);text-align:center;padding:16px 0;}

.wrong-item{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;}
.wrong-item .w-area{font-size:11px;font-weight:700;color:var(--accent);}
.wrong-item .w-q{font-weight:600;line-height:1.5;}
.wrong-item .w-ans{font-size:12px;color:var(--sub);}
.wrong-item .w-ans b{color:var(--wrong);}
.wrong-item .w-explain{font-size:12px;line-height:1.6;background:var(--accent-light);border-radius:8px;padding:8px 10px;color:var(--text);white-space:pre-line;}

#start-screen{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:560px;}
#start-screen.hidden{display:none;}

.start-card{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:30px 26px;text-align:center;display:flex;flex-direction:column;gap:10px;}
.start-card h2{font-size:22px;font-weight:700;}
.start-card p{font-size:13px;color:var(--sub);line-height:1.7;}

.mode-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:16px 12px;font-family:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;transition:background .1s,border-color .1s;}
.mode-btn:hover{background:var(--accent-light);border-color:var(--accent);}
.mode-btn.full{grid-column:1 / -1;background:var(--accent);border-color:var(--accent);}
.mode-btn.full .m-name,.mode-btn.full .m-sub{color:#fff;}
.mode-btn .m-name{font-size:14px;font-weight:700;}
.mode-btn .m-sub{font-size:11px;color:var(--sub);}

@media(prefers-reduced-motion:reduce){
  .choice-btn,#progress-bar,#timer-bar,#feedback{transition:none;}
}
</style>
</head>
<body>

<a id="back-link" href="../../">← Game Hub</a>

<!-- 시작 화면 -->
<div id="start-screen">
  <div class="start-card">
    <div style="font-size:38px">💼</div>
    <h2>적성검사 실전 연습</h2>
    <p>SK그룹 SKCT 인지역량 유형(언어이해·자료해석·창의수리·언어추리·수열추리)을 본떠 만든 연습 문제입니다.<br>실제 기출문항이 아닌 자체 제작 문항입니다.</p>
  </div>
  <div class="mode-grid" id="mode-grid"></div>
  <button id="btn-history" onclick="showHistory()">📚 학습 기록 보기</button>
</div>

<!-- 학습 기록 화면 -->
<div id="history-screen">
  <div class="result-card">
    <div class="section-title">세션 기록</div>
    <div class="history-list" id="history-list"></div>
  </div>
  <div class="result-card">
    <div class="section-title">오답 노트</div>
    <div class="wrong-notebook" id="wrong-notebook"></div>
  </div>
  <button id="btn-close-history" onclick="closeHistory()">메뉴로 돌아가기</button>
  <button id="btn-clear-history" onclick="clearHistory()">기록 전체 삭제</button>
</div>

<!-- 게임 화면 -->
<div id="game-wrap" class="hidden">
  <header>
    <h1>적성검사 연습</h1>
    <span id="area-badge">-</span>
  </header>

  <div id="progress-wrap">
    <div id="progress-info">
      <span id="q-counter">1 / 10</span>
      <span id="score-label">점수 0</span>
    </div>
    <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
  </div>

  <div id="score-row">
    <div class="chip"><span class="c-label">정답</span><span class="c-val" id="correct-count">0</span></div>
    <div class="chip"><span class="c-label">연속</span><span class="c-val" id="streak-count">0 🔥</span></div>
    <div class="chip"><span class="c-label">점수</span><span class="c-val" id="score-disp">0</span></div>
  </div>

  <div id="timer-wrap">
    <div id="timer-bar-bg"><div id="timer-bar" style="width:100%"></div></div>
    <span id="timer-label">30s</span>
  </div>

  <div id="question-card">
    <div id="q-type-label">—</div>
    <div id="content-area"></div>
    <div id="hint-text"></div>
  </div>

  <div id="choices"></div>
  <div id="feedback"></div>
  <div id="explain-box"></div>
  <button id="btn-next" onclick="manualNext()">다음 문제 →</button>
</div>

<!-- 결과 화면 -->
<div id="result-screen">
  <div class="result-card">
    <div class="r-label">최종 점수</div>
    <div class="r-big" id="final-score">0</div>
    <div class="grade-badge" id="grade-text"></div>
    <div class="r-grid">
      <div class="r-stat"><span class="rv" id="r-correct">0</span><span class="rl">정답</span></div>
      <div class="r-stat"><span class="rv" id="r-acc">0%</span><span class="rl">정확도</span></div>
      <div class="r-stat"><span class="rv" id="r-total">0</span><span class="rl">총 문항</span></div>
    </div>
    <div class="area-breakdown" id="area-breakdown"></div>
  </div>
  <button id="btn-restart" onclick="restartSameMode()">같은 유형 다시</button>
  <button id="btn-menu" onclick="backToMenu()">유형 선택으로</button>
</div>

<script>
/* ═══════════════════════════════════════════
   영역 정보
═══════════════════════════════════════════ */
const AREA_INFO = {
  verbal:{label:'언어이해', icon:'📖', time:45},
  data:  {label:'자료해석', icon:'📊', time:45},
  math:  {label:'창의수리', icon:'🧮', time:35},
  logic: {label:'언어추리', icon:'🔎', time:30},
  seq:   {label:'수열추리', icon:'🔢', time:30},
};
const AREA_ORDER = ['verbal','data','math','logic','seq'];

/* ═══════════════════════════════════════════
   문제 풀 (자체 제작 연습 문항)
═══════════════════════════════════════════ */
const POOLS = {

verbal:[
  {passage:'인공지능 기술이 발전하면서 다양한 산업 분야에서 자동화가 빠르게 진행되고 있다. 그러나 일부 전문가들은 자동화가 확대될수록 인간의 판단이 필요한 영역의 가치가 오히려 커질 것이라고 예측한다.',
   q:'윗글의 요지로 가장 적절한 것은?',
   choices:['자동화가 확대되어도 인간 판단의 가치는 커질 것이다','자동화는 모든 산업 분야에서 동일한 속도로 진행된다','전문가들은 자동화 확대에 반대한다','인간의 판단은 더 이상 필요하지 않다'],
   answer:'자동화가 확대되어도 인간 판단의 가치는 커질 것이다',
   explain:'지문은 두 문장으로 구성되는데, 역접 접속사 "그러나" 뒤에 오는 두 번째 문장이 필자가 강조하려는 핵심 주장인 경우가 많다. 여기서는 "자동화가 확대될수록 인간의 판단이 필요한 영역의 가치가 오히려 커질 것"이라는 예측이 그 핵심이므로 정답이다.\n② 지문에는 산업별 자동화 속도를 비교하는 내용이 없으므로 근거 없는 선택지다.\n③ 전문가들은 자동화 확대에 반대한 것이 아니라 그 이후의 변화를 "예측"했을 뿐이므로 지문 내용과 다르다.\n④ "인간의 판단이 필요한 영역의 가치가 커진다"는 내용과 정반대이므로 오답이다.'},
  {passage:'기업이 재택근무 제도를 도입한 이후 직원 만족도는 높아졌지만, 부서 간 협업 효율은 오히려 낮아졌다는 조사 결과가 나왔다. 이에 일부 기업은 주 2~3회 출근을 의무화하는 하이브리드 근무제를 도입하고 있다.',
   q:'윗글에서 알 수 있는 내용으로 가장 적절한 것은?',
   choices:['재택근무는 직원 만족도와 협업 효율을 모두 높였다','일부 기업은 하이브리드 근무제로 전환하고 있다','모든 기업이 재택근무를 폐지했다','협업 효율은 재택근무와 무관하다'],
   answer:'일부 기업은 하이브리드 근무제로 전환하고 있다',
   explain:'지문의 마지막 문장 "이에 일부 기업은 주 2~3회 출근을 의무화하는 하이브리드 근무제를 도입하고 있다"에서 정답의 근거를 그대로 확인할 수 있다.\n① 지문은 재택근무가 만족도는 높였지만 협업 효율은 "낮췄다"고 했으므로, 둘 다 높였다는 것은 모순이다.\n③ 지문은 "일부" 기업이 하이브리드 근무제를 도입한다고 했을 뿐, 재택근무를 완전히 폐지했다는 언급은 없어 지나친 일반화다.\n④ 재택근무 도입 이후 협업 효율이 낮아졌다고 했으므로 "무관하다"는 지문과 반대된다.'},
  {passage:'한 연구에 따르면 소비자는 가격이 지나치게 저렴한 제품에 오히려 품질을 의심하는 경향을 보인다. 반면 지나치게 비싼 제품에 대해서도 실제 가치보다 과대평가되었다고 느끼는 경우가 많다.',
   q:'윗글의 내용과 일치하는 것은?',
   choices:['소비자는 항상 저렴한 제품을 선호한다','가격은 품질 인식에 영향을 준다','비싼 제품은 항상 신뢰를 얻는다','소비자는 가격에 영향을 받지 않는다'],
   answer:'가격은 품질 인식에 영향을 준다',

  {passage:"최근 한 조사에서 신입사원의 이직 이유 1위는 '낮은 연봉'이 아니라 '성장 기회의 부재'로 나타났다. 이는 기업이 보상 체계뿐 아니라 교육과 승진 경로 설계에도 신경 써야 함을 시사한다.",

  {passage:'어떤 습관을 형성하는 데 걸리는 시간은 사람마다 다르지만, 평균적으로 66일 정도가 걸린다는 연구 결과가 있다. 다만 습관의 난이도와 반복 환경에 따라 그 기간은 크게 달라질 수 있다.',

data:[
  {table:{headers:['연도','매출액(억원)'],rows:[['2022','120'],['2023','150'],['2024','180']]},
   q:'2023년 매출액의 전년 대비 증가율은 약 몇 %인가?',
   choices:['25','20','30','15'], answer:'25',
   explain:'전년 대비 증가율 공식은 (올해 값 - 작년 값) ÷ 작년 값 × 100 이다.\n2023년 기준 작년은 2022년(120억원)이므로: (150-120)÷120×100 = 30÷120×100 = 25%\n※ 증가율의 분모는 반드시 "비교 기준이 되는 작년 값"이어야 한다. 만약 분모를 실수로 2023년 값(150)으로 나누면 30÷150×100=20%가 되어 오답 ②가 나오므로, 분모를 헷갈리지 않는 것이 핵심이다.'},
  {table:{headers:['부서','인원(명)'],rows:[['영업','40'],['개발','65'],['인사','15'],['총무','20']]},
   q:'개발 부서 인원이 전체 인원에서 차지하는 비중은 약 몇 %인가? (전체 140명)',
   choices:['46','35','50','60'], answer:'46',
   explain:'전체 인원 = 40+65+15+20 = 140명이다.\n비중(%) = 부서 인원 ÷ 전체 인원 × 100 = 65÷140×100 ≈ 46.43%\n소수점 첫째 자리에서 반올림하면 약 46%가 되어 정답이다. 다른 선택지들은 분모나 분자를 다른 부서 값과 혼동했을 때 나올 수 있는 값들이다.'},
  {table:{headers:['제품','판매량(개)'],rows:[['A','320'],['B','480'],['C','200']]},
   q:'B 제품의 판매량은 C 제품의 몇 배인가?',
   choices:['2.4','1.5','3','2'], answer:'2.4',
   explain:'"B는 C의 몇 배인가"는 B÷C를 계산하는 문제다.\n480÷200 = 2.4배\n1.5는 200÷320(A 대비 C)과 같은 다른 조합을 계산했을 때 나올 수 있는 값이며, 3이나 2는 어림 계산으로 반올림을 잘못했을 때 나오는 오답이다.'},

   q:'3월 방문자 수는 1월 대비 몇 명 증가했는가?',
   choices:['300','150','250','350'], answer:'300',
   explain:'증가한 인원 수는 비교 대상 두 값의 차이를 구하면 된다.\n3월(1,100명) - 1월(800명) = 300명\n150은 2월과 1월의 차이(950-800), 즉 엉뚱한 두 달을 비교했을 때 나오는 값이므로 "1월 대비"라는 기준을 정확히 지키는 것이 중요하다.'},

math:[
  {text:'시속 60km로 달리는 자동차가 150km를 가는 데 걸리는 시간은?',
   choices:['2시간 30분','2시간','3시간','1시간 30분'], answer:'2시간 30분',
   explain:'거리, 속력, 시간의 관계식은 "시간 = 거리 ÷ 속력"이다.\n150km ÷ 60km/h = 2.5시간\n0.5시간을 분 단위로 바꾸면 0.5×60=30분이므로, 2.5시간은 2시간 30분이다. 정수 부분만 보고 "2시간"을 고르거나, 소수를 그대로 "몇 분"으로 착각하지 않도록 주의해야 한다.'},
  {text:'농도 20%의 소금물 200g에 물 50g을 추가하면 농도는 몇 %가 되는가?',
   choices:['16','20','14','18'], answer:'16',
   explain:'농도(%) = 소금의 양 ÷ 소금물 전체 양 × 100 이며, 물을 더해도 소금의 양 자체는 변하지 않는다는 점이 핵심이다.\n① 처음 소금의 양 = 200g × 20% = 40g\n② 물 50g을 추가한 후 전체 소금물 양 = 200+50 = 250g\n③ 새 농도 = 40 ÷ 250 × 100 = 16%\n원래 농도인 20%를 그대로 고르지 않도록 주의해야 하며, 물을 추가하면 소금의 절대량은 그대로여도 농도(비율)는 반드시 낮아진다.'},
  {text:'1부터 20까지의 자연수 중 3의 배수의 개수는?',
   choices:['6','7','5','8'], answer:'6',
   explain:'1부터 20까지의 3의 배수를 직접 나열하면 3, 6, 9, 12, 15, 18로 총 6개다.\n공식으로는 "1부터 n까지 k의 배수 개수 = ⌊n÷k⌋"를 사용하며, 20÷3=6.67…이므로 소수점을 버린 몫인 6이 정답이다. 21을 포함해서 세거나 나눗셈의 나머지를 반올림하면 7이라는 오답이 나올 수 있으니 주의한다.'},
  {text:'A와 B 두 사람이 함께 일하면 6일이 걸리는 일을 A 혼자 하면 10일이 걸린다. B 혼자 하면 며칠이 걸리는가?',
   choices:['15','12','20','18'], answer:'15',
   explain:'일 문제는 전체 작업량을 1로 놓고 "하루에 처리하는 비율(작업 속도)"을 기준으로 계산한다.\n① A의 하루 작업량 = 1/10\n② A와 B가 함께 할 때의 하루 작업량 = 1/6\n③ B의 하루 작업량 = (함께 할 때) - (A만) = 1/6 - 1/10 = 5/30 - 3/30 = 2/30 = 1/15\n④ B의 하루 작업량이 1/15이라는 것은, B 혼자서는 전체 일을 끝내는 데 15일이 걸린다는 뜻이다. 두 사람의 소요 일수(10일, 6일)를 단순히 더하거나 빼면 안 되고 반드시 "작업 속도(분수)"로 바꿔 계산해야 한다.'},
  {text:'주사위를 두 번 던져서 나온 눈의 합이 7이 될 경우의 수는?',
   choices:['6','5','7','4'], answer:'6',
   explain:'주사위를 두 번 던지면 나올 수 있는 전체 경우의 수는 6×6=36가지이며, 그중 눈의 합이 정확히 7이 되는 순서쌍을 모두 나열하면 된다.\n(1,6), (2,5), (3,4), (4,3), (5,2), (6,1) → 총 6가지\n(1,6)과 (6,1)처럼 순서가 다른 경우도 서로 다른 경우로 세어야 한다는 점에 유의해야 하며, 이를 같은 경우로 착각해 절반만 세면 3가지라는 오답이 나온다.'},
  {text:'원가 8,000원인 물건에 25% 이익을 붙여 정가를 정했다. 정가는 얼마인가?',
   choices:['10,000원','9,000원','11,000원','9,500원'], answer:'10,000원',
   explain:'이익을 붙인 정가 = 원가 × (1 + 이익률)로 계산한다.\n25% = 0.25이므로 정가 = 8,000 × (1+0.25) = 8,000 × 1.25 = 10,000원\n이익금(8,000×0.25=2,000원)만 따로 구한 뒤 원가에 더해도(8,000+2,000=10,000원) 같은 결과가 나온다. 이익률을 원가에 곱하지 않고 그대로 더하면(8,000+25=8,025원) 안 된다는 점에 주의한다.'},
],

logic:[
  {premises:['모든 사원은 신입 교육을 받는다.','철수는 사원이다.'], statement:'철수는 신입 교육을 받는다.',
   choices:['참','거짓','알 수 없음'], answer:'참',
   explain:'이런 유형은 "모든 A는 B이다 + 어떤 개체는 A이다 → 그 개체는 B이다" 형태의 정언 삼단논법이다.\n전제1: "모든 사원(A)은 신입 교육을 받는다(B)" → A이면 반드시 B\n전제2: "철수는 사원이다(A)" → 철수는 A에 속함\n결론: 철수는 A이므로 반드시 B, 즉 "철수는 신입 교육을 받는다"는 항상 참이다. 예외를 허용하지 않는 "모든"이라는 전칭 표현이 핵심 단서다.'},
  {premises:['A는 B보다 크다.','B는 C보다 크다.'], statement:'C는 A보다 크다.',
   choices:['참','거짓','알 수 없음'], answer:'거짓',
   explain:'대소 관계는 이어 붙여서 하나의 부등식으로 정리하면 쉽다.\nA>B, B>C이므로 두 식을 연결하면 A>B>C, 즉 A가 가장 크고 C가 가장 작다.\n따라서 "C는 A보다 크다"는 실제 대소 관계(C<A)와 정반대이므로 거짓이다. "알 수 없음"으로 착각하기 쉽지만, 두 전제만으로 세 값의 순서가 완전히 확정되므로 참/거짓을 명확히 판단할 수 있다.'},
  {premises:['비가 오면 우산을 챙긴다.','오늘은 우산을 챙기지 않았다.'], statement:'오늘은 비가 오지 않았다.',
   choices:['참','거짓','알 수 없음'], answer:'참',
   explain:'전제1을 "비가 온다(P) → 우산을 챙긴다(Q)"라는 조건문으로 정리할 수 있다.\n조건문 P→Q가 참일 때, 그 대우(對偶)인 "¬Q → ¬P"(우산을 챙기지 않았다면 비가 오지 않았다) 역시 항상 참이라는 것이 논리학의 기본 규칙이다.\n전제2 "우산을 챙기지 않았다"는 ¬Q에 해당하므로, 대우에 의해 ¬P, 즉 "비가 오지 않았다"는 참이다. (참고: "우산을 챙겼다고 반드시 비가 온다"는 역은 성립하지 않으므로 혼동하지 않도록 주의한다.)'},
  {premises:['어떤 학생은 축구를 좋아한다.','민수는 학생이다.'], statement:'민수는 축구를 좋아한다.',
   choices:['참','거짓','알 수 없음'], answer:'알 수 없음',

  {premises:['빨간 공은 모두 상자 안에 있다.','이 공은 상자 밖에 있다.'], statement:'이 공은 빨간 공이 아니다.',
   choices:['참','거짓','알 수 없음'], answer:'참',
   explain:'전제1을 "빨간 공이다(P) → 상자 안에 있다(Q)"라는 조건문으로 정리할 수 있다.\n전제2 "이 공은 상자 밖에 있다"는 ¬Q에 해당하며, 조건문의 대우 ¬Q→¬P(상자 밖에 있으면 빨간 공이 아니다)는 항상 참이므로, 이 공은 빨간 공이 아니라는 결론이 성립한다.\n(주의: "상자 안에 있는 공은 모두 빨갛다"는 원래 전제와 다른 내용이므로 혼동하지 않아야 한다. 전제는 어디까지나 "빨간 공이면 상자 안에 있다"는 방향으로만 성립한다.)'},
],

seq:[
  {seq:[3,7,15,31,'?'], choices:['63','62','64','61'], answer:'63',

  {seq:[4,9,19,39,'?'], choices:['79','78','80','77'], answer:'79',
   explain:'이웃한 두 항의 관계를 확인한다: 4→9는 4×2+1=9, 9→19는 9×2+1=19, 19→39는 19×2+1=39로 모두 "×2 하고 1을 더한다"는 동일한 규칙이 적용된다.\n같은 규칙을 마지막 항에 적용하면 39×2+1=79가 정답이다.'},
  {seq:[1,4,10,22,'?'], choices:['46','44','48','45'], answer:'46',
   explain:'이웃한 두 항의 관계를 확인한다: 1→4는 1×2+2=4, 4→10은 4×2+2=10, 10→22는 10×2+2=22로 모두 "×2 하고 2를 더한다"는 동일한 규칙이 적용된다.\n같은 규칙을 마지막 항에 적용하면 22×2+2=46이 정답이다.'},
],

};

/* ═══════════════════════════════════════════
   게임 상태
═══════════════════════════════════════════ */
let state={
  mode:null, qIndex:0, score:0, correctCount:0, streak:0, answered:false,
  questions:[], stats:{}, wrongItems:[], timerInterval:null, timeLeft:0,
};

const $=id=>document.getElementById(id);
const HISTORY_KEY='skct_study_history';

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}

/* ═══════════════════════════════════════════
   시작 화면 / 모드 구성
═══════════════════════════════════════════ */
function buildModeGrid(){
  const grid=$('mode-grid');
  let html=`<button class="mode-btn full" onclick="startGame('all')">
    <span class="m-name">🧭 전체 모의고사</span>
    <span class="m-sub">5개 영역 · 총 10문항</span>
  </button>`;
  AREA_ORDER.forEach(key=>{
    const a=AREA_INFO[key];
    html+=`<button class="mode-btn" onclick="startGame('${key}')">
      <span class="m-name">${a.icon} ${a.label}</span>
      <span class="m-sub">${POOLS[key].length}문항 · 문항당 ${a.time}초</span>
    </button>`;
  });
  grid.innerHTML=html;
}
buildModeGrid();

function buildQuestions(mode){
  let qs=[];
  if(mode==='all'){
    AREA_ORDER.forEach(key=>{
      const picks=shuffle(POOLS[key]).slice(0,2);
      picks.forEach(p=>qs.push({...p, area:key}));
    });
    qs=shuffle(qs);
  } else {
    qs=shuffle(POOLS[mode]).map(p=>({...p, area:mode}));
  }
  return qs;
}

/* ═══════════════════════════════════════════
   HUD
═══════════════════════════════════════════ */
function updateHUD(){
  const total=state.questions.length;
  $('q-counter').textContent=`${state.qIndex+1} / ${total}`;
  $('score-label').textContent=`점수 ${state.score}`;
  $('correct-count').textContent=state.correctCount;
  $('streak-count').textContent=`${state.streak} 🔥`;
  $('score-disp').textContent=state.score;
  $('progress-bar').style.width=`${(state.qIndex/total)*100}%`;
  const area=state.questions[state.qIndex]?.area;
  $('area-badge').textContent=area?AREA_INFO[area].label:'-';
}

/* ═══════════════════════════════════════════
   타이머
═══════════════════════════════════════════ */
function startTimer(limit){
  clearInterval(state.timerInterval);
  state.timeLeft=limit;
  updateTimerUI(limit);
  state.timerInterval=setInterval(()=>{
    state.timeLeft-=.1;
    updateTimerUI(limit);
    if(state.timeLeft<=0){
      clearInterval(state.timerInterval);
      if(!state.answered) timeOut();
    }
  },100);
}
function updateTimerUI(limit){
  const pct=Math.max(0,state.timeLeft/limit*100);
  $('timer-bar').style.width=pct+'%';
  $('timer-bar').style.background=pct>50?'#2563eb':pct>25?'#d97706':'#dc2626';
  $('timer-label').textContent=Math.ceil(state.timeLeft)+'s';
}
function timeOut(){
  state.answered=true;
  state.streak=0;
  recordStat(false);
  showFeedback(false,'⏰ 시간 초과!');
  highlightCorrect();
  disableChoices();
  const q=state.questions[state.qIndex];
  recordWrong(q,null);
  showExplain(q);
  updateHUD();
}

/* ═══════════════════════════════════════════
   문제 렌더
═══════════════════════════════════════════ */
function renderQuestion(){
  const q=state.questions[state.qIndex];
  state.answered=false;
  clearFeedback();
  hideExplain();
  updateHUD();

  const typeLabels={verbal:'— 언어이해 —',data:'— 자료해석 —',math:'— 창의수리 —',logic:'— 언어추리 —',seq:'— 수열추리 —'};
  $('q-type-label').textContent=typeLabels[q.area];

  const content=$('content-area');
  if(q.area==='verbal'){
    content.innerHTML=`<div class="passage">${q.passage}</div><div class="q-text">${q.q}</div>`;
  } else if(q.area==='data'){
    const rows=q.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
    content.innerHTML=`<table class="data-table"><thead><tr>${q.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table><div class="q-text">${q.q}</div>`;
  } else if(q.area==='math'){
    content.innerHTML=`<div class="word-text">${q.text}</div>`;
  } else if(q.area==='logic'){
    content.innerHTML=`<div class="premise-box">${q.premises.map(p=>`<div class="premise">${p}</div>`).join('')}</div><div class="q-text">다음 문장은 참인가, 거짓인가, 알 수 없는가?<br><strong>${q.statement}</strong></div>`;
  } else if(q.area==='seq'){
    content.innerHTML=`<div class="seq-row">${q.seq.map(v=>`<div class="seq-num ${v==='?'?'blank':''}">${v}</div>`).join('')}</div><div class="q-text">다음에 올 알맞은 숫자는?</div>`;
  }

  $('hint-text').textContent='';
  renderChoices(q);
  startTimer(AREA_INFO[q.area].time);
}

function renderChoices(q){
  $('choices').innerHTML=q.choices.map(c=>
    `<button class="choice-btn" onclick="answer(this,'${String(c).replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
}

/* ═══════════════════════════════════════════
   정답 처리
═══════════════════════════════════════════ */
function answer(btn,chosen){
  if(state.answered)return;
  state.answered=true;
  clearInterval(state.timerInterval);
  const q=state.questions[state.qIndex];
  const ok=String(chosen)===String(q.answer);
  disableChoices();
  recordStat(ok);

  if(ok){
    btn.classList.add('correct');
    state.correctCount++;
    state.streak++;
    const bonus=(state.streak>=3?20:10);
    state.score+=bonus;
    showFeedback(true,state.streak>=3?`🔥 ${state.streak}연속 정답! +${bonus}점`:`✅ 정답! +${bonus}점`);
  } else {
    btn.classList.add('wrong');
    state.streak=0;
    highlightCorrect();
    showFeedback(false,'❌ 오답');
    recordWrong(q,chosen);
  }
  updateHUD();
  showExplain(q);
}

function getPrompt(q){
  if(q.area==='verbal'||q.area==='data') return q.q;
  if(q.area==='math') return q.text;
  if(q.area==='logic') return q.statement;
  if(q.area==='seq') return `수열: ${q.seq.join(', ')}`;
  return '';
}

function recordWrong(q,chosen){
  state.wrongItems.push({
    area:q.area,
    prompt:getPrompt(q),
    chosen: chosen===null ? '(시간 초과)' : chosen,
    answer:q.answer,
    explain:q.explain,
  });
}

function highlightCorrect(){
  const q=state.questions[state.qIndex];
  document.querySelectorAll('.choice-btn').forEach(b=>{
    if(b.textContent.trim()===String(q.answer)) b.classList.add('correct');
  });
}

function recordStat(ok){
  const area=state.questions[state.qIndex].area;
  if(!state.stats[area]) state.stats[area]={correct:0,total:0};
  state.stats[area].total++;
  if(ok) state.stats[area].correct++;
}

function disableChoices(){
  document.querySelectorAll('.choice-btn').forEach(b=>{b.onclick=null;b.style.cursor='default';});
}

function showFeedback(ok,msg){
  const f=$('feedback');
  f.textContent=msg;
  f.className='show '+(ok?'correct':'wrong');
}
function clearFeedback(){
  const f=$('feedback');
  f.className='';
  f.textContent='';
}

function showExplain(q){
  const box=$('explain-box');
  box.innerHTML=`<span class="e-label">💡 해설</span>${q.explain}`;
  box.classList.add('show');
  $('btn-next').classList.add('show');
}
function hideExplain(){
  const box=$('explain-box');
  box.classList.remove('show');
  box.innerHTML='';
  $('btn-next').classList.remove('show');
}
function manualNext(){
  hideExplain();
  nextQuestion();
}

/* ═══════════════════════════════════════════
   흐름
═══════════════════════════════════════════ */
function nextQuestion(){
  state.qIndex++;
  if(state.qIndex>=state.questions.length) endGame();
  else renderQuestion();
}

function startGame(mode){
  $('start-screen').classList.add('hidden');
  $('result-screen').classList.remove('show');
  $('game-wrap').classList.remove('hidden');

  state={mode,qIndex:0,score:0,correctCount:0,streak:0,answered:false,
    questions:buildQuestions(mode),stats:{},wrongItems:[],timerInterval:null,timeLeft:0};

  renderQuestion();
}

function restartSameMode(){
  $('result-screen').classList.remove('show');
  startGame(state.mode);
}

function backToMenu(){
  clearInterval(state.timerInterval);
  $('result-screen').classList.remove('show');
  $('game-wrap').classList.add('hidden');
  $('start-screen').classList.remove('hidden');
}

function endGame(){
  clearInterval(state.timerInterval);
  $('game-wrap').classList.add('hidden');
  $('result-screen').classList.add('show');

  const total=state.questions.length;
  $('final-score').textContent=state.score;
  $('r-correct').textContent=state.correctCount;
  $('r-acc').textContent=Math.round(state.correctCount/total*100)+'%';
  $('r-total').textContent=total;

  const pct=state.correctCount/total;
  let grade='';
  if(pct>=.9)grade='🏆 최상위권';
  else if(pct>=.7)grade='⭐ 우수';
  else if(pct>=.5)grade='👍 보통';
  else grade='💪 계속 연습!';
  $('grade-text').textContent=grade;

  const bd=$('area-breakdown');
  bd.innerHTML=AREA_ORDER
    .filter(key=>state.stats[key])
    .map(key=>{
      const s=state.stats[key];
      return `<div class="area-row"><span class="a-name">${AREA_INFO[key].icon} ${AREA_INFO[key].label}</span><span class="a-score">${s.correct} / ${s.total}</span></div>`;
    }).join('');

  saveHistoryEntry({
    ts:Date.now(), mode:state.mode, total,
    correct:state.correctCount,
    accuracy:Math.round(pct*100),
    score:state.score,
    areaStats:state.stats,
    wrongItems:state.wrongItems,
  });
}

/* ═══════════════════════════════════════════
   학습 기록 (localStorage)
═══════════════════════════════════════════ */
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }
  catch(e){ return []; }
}
function saveHistoryEntry(entry){
  const list=loadHistory();
  list.push(entry);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(-50)));
}

function modeLabel(mode){
  return mode==='all' ? '🧭 전체 모의고사' : `${AREA_INFO[mode].icon} ${AREA_INFO[mode].label}`;
}

function formatDate(ts){
  const d=new Date(ts);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showHistory(){
  $('start-screen').classList.add('hidden');
  $('history-screen').classList.add('show');
  renderHistoryScreen();
}
function closeHistory(){
  $('history-screen').classList.remove('show');
  $('start-screen').classList.remove('hidden');
}
function clearHistory(){
  if(!confirm('학습 기록과 오답 노트를 모두 삭제할까요?')) return;
  localStorage.removeItem(HISTORY_KEY);
  renderHistoryScreen();
}

function renderHistoryScreen(){
  const history=loadHistory();

  const listEl=$('history-list');
  if(history.length===0){
    listEl.innerHTML='<div class="history-empty">아직 완료한 모의고사가 없습니다.</div>';
  } else {
    listEl.innerHTML=[...history].reverse().map(h=>`
      <div class="history-item">
        <div class="h-top"><span>${modeLabel(h.mode)}</span><span>${h.score}점</span></div>
        <div class="h-sub">${formatDate(h.ts)} · 정답 ${h.correct}/${h.total} · 정확도 ${h.accuracy}%</div>
      </div>`).join('');
  }

  const wrongEl=$('wrong-notebook');
  const allWrong=history.flatMap(h=>h.wrongItems||[]);
  if(allWrong.length===0){
    wrongEl.innerHTML='<div class="history-empty">아직 기록된 오답이 없습니다.</div>';
  } else {
    wrongEl.innerHTML=[...allWrong].reverse().slice(0,30).map(w=>`
      <div class="wrong-item">
        <span class="w-area">${AREA_INFO[w.area].icon} ${AREA_INFO[w.area].label}</span>
        <span class="w-q">${w.prompt}</span>
        <span class="w-ans">내 답: <b>${w.chosen}</b> · 정답: ${w.answer}</span>
        <span class="w-explain">💡 ${w.explain}</span>
      </div>`).join('');
  }
}
</script>
</body>
</html>
